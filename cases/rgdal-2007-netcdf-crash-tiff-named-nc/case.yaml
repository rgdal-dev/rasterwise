id: rgdal-2007-netcdf-crash-tiff-named-nc
title: "2007: rgdal crashed R on the first four problem files, and the workaround wrote TIFFs named .nc"
status: fixed-upstream
costume:
  - D
  - C
  - none
summary: "The origin of this archive: R 2.5.0 with rgdal 0.5-9 and GDAL 1.4.0 crashed on GDAL.open() of four netCDF files; gdal_translate to *.nc names produced GeoTIFFs, misoriented and off by a cell."
