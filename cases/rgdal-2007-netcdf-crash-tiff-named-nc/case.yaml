whats_wrong: |
  The working folder nctrouble.R lives in is dated 2007-05-01. The script records
  R 2.5.0 (i386-pc-mingw32), rgdal 0.5-9, sp 0.9-13 and GDAL 1.4.0 from FWTools
  1.2.2. The four files are the AVISO DT geostrophic velocity grid, OSCAR
  tropical Pacific currents, an Argo float (R13352) and WOCE sea surface
  height (ssh05d).
  1. rgdal's GDAL.open() crashed R on each of them (RCrash.png is the Windows
     "R for Windows GUI front-end has encountered a problem" dialog), and opening
     their subdatasets (NETCDF:"file":var) failed as well.
  2. The workaround was gdal_translate NETCDF:"file":var out.nc. gdal_translate's
     default output format was GTiff, so every result is a GeoTIFF named .nc
     (dt.nc, oscar.nc, R133.nc, ssh05.nc; p.nc and p_calibrate.nc are 51 x 54
     like R133.nc and look like the same pattern applied to other R13352
     variables, though the script doesn't show those calls).
  3. The converted grids carry the orientation problems the 2026 cases describe.
     dt.nc is 915 x 1080 (latitude along x: "aligned E-W up" in the script; the
     source is stored lon-major), and ssh05.nc has a south-up origin (-89.75)
     with positive pixel height ("aligned South-up"; latitude is ascending).
  4. GDAL 1.4 built the geotransform from the coordinate values wrongly in two
     ways: it put the origin at the first cell centre rather than its edge, and
     divided the centre-to-centre span by the number of cells. oscar.nc has
     origin (120.5, 34.5) and pixel size 0.9941 x 0.9857 for a 1 degree grid
     (169 / 170 and 69 / 70); ssh05.nc has 0.4993 x 0.4986 for a 0.5 degree grid.
  The .txt files are gdalinfo output from GDAL 1.4 for each source file, a
  baseline for comparison with current GDAL.
how_to_read: |
  The source files read correctly with current GDAL; each has its own case for
  the remaining issues (aviso-mercator-as-lonlat, oscar-pacific-0-360-dateline,
  argo-profiles-char-dim-dropped, topex-ssh-noncf-fill-sentinels).
  Verified with GDAL 3.14.0dev on 2026-11-07:
    gdalinfo 'NETCDF:"oscar_gdr_5d1993.nc":u'
      -> Size 170 x 70, Origin (120, 35), Pixel Size (1, -1)
    gdalinfo 'NETCDF:"ssh05d19921006.nc":sea_level'
      -> Size 720 x 360, Origin (0, 90), Pixel Size (0.5, -0.5)
  The derived *.nc TIFFs open as GTiff in any reader that probes content. Their
  geotransforms carry the 2007 errors above, so don't use them as references.
