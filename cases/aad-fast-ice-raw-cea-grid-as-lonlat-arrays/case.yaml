id: aad-fast-ice-raw-cea-grid-as-lonlat-arrays
title: "AAD MODIS 20-day fast ice: headerless images stored south-up, geolocated by raw lat/lon arrays that are a 2 km cylindrical equal-area grid"
status: understood
costume:
  - A
  - E
summary: "4300 x 425 byte images with no header; the separate float32 lats.img/lons.img are a regular 2000 m grid in WGS84 Lambert cylindrical equal-area (standard parallel 65 S) to within 0.42 m, rows stored south to north; the README omits byte order and row order, never mentions coastmask.img (Int16, stored north to south), and promises a .gpd file that is not there."
