id: ucsd-topo-raw-mercator-headers-disagree
title: "UCSD global 1-minute topography: a headerless spherical Mercator grid whose ERS header, hand-written VRTs and netCDF all describe it differently"
status: understood
costume:
  - A
  - B
  - C
summary: "topo_N.img is 21600 x 17280 big-endian Int16 on a spherical Mercator grid with square 1-arcminute pixels (0 to 360 E, 80.738 S to 80.738 N); the ERS header gives GDAL no geotransform, the hand-written VRTs misplace cells by up to 11 km in latitude (and 0.4 degrees in longitude for the sphere-based ones), and topo_N.nc is not the same grid but a float32 resample onto regular lon/lat that drops the sounding flag."
