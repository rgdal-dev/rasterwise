id: coco-displaced-pole-model-axes-as-lonlat
title: "COCO Southern Ocean ice-ocean output: displaced-pole model coordinates labelled as longitude and Mercator-spaced latitude"
status: understood
costume:
  - D
  - E
summary: "Daily sea ice fields on a 1024 x 384 COCO model grid whose 1D longitude/latitude axes are model coordinates (pole moved to 82S 45E), not geography; read them as lon/lat and cells land a median 45 degrees of arc from where they belong. The true positions are in separate 2D lon0/lat0 files, which are regular in a polar stereographic -> shift -> log-polar PROJ pipeline to within 7 m."
