id: silo-rain-year-chunks-slow-band-reads
title: "SILO daily rain: chunks span the whole year, so GDAL reads the full file once per band"
status: understood
costume:
  - C
summary: "A SILO annual daily_rain netCDF-4 file is chunked (365, 30, 50); GDAL's band-by-band read pulls every chunk for every day, about 428 MB per band, which made nc-to-GeoTIFF conversion take tens of minutes in 2019."
