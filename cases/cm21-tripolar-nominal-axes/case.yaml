id: cm21-tripolar-nominal-axes
title: "GFDL CM2.1 ocean: 1D lon/lat axes are nominal; true positions are 2D (tripolar north of 65N)"
status: understood
summary: "A CM2.1 ocean region mask with nominal 1D axes plus true 2D geolon/geolat, and an SST file on the same grid whose 1D xt/yt are neither the nominal nor the true positions; use the mask file's geolon_t/geolat_t as geolocation for the SST."
files:
  - 10b6eb4ff393722069f2c38ef2ea37971b8c091460f65fbcd1bd10d7a0f43453  # extdata/rectilinear/CM2.1_regionmask.nc
  - 6110fe067b57ef81777be213c2ed6bdb49edc435fb7c1a082fc527282953ac75  # extdata/rectilinear/readme_CM2.1regionmask.txt
  - 83f2a77cc9f3591cc72f5fd0dbf1a043e81f2f0665a69fb884181d7cae5387b4  # extdata/rectilinear/test_3_.nc
whats_wrong: |
  CM2.1_regionmask.nc (an FMS mpp_io file, "regionmask.nc") has two
  staggered grids, T and C (the C axes are offset +0.5 degree from the T
  axes in both lon and lat), each 360 x 200. The readme describes it as "regular in longitude but
  non regular in latitude" with an Arakawa staggered grid. Checked on the
  bytes:

  1. gridlon_t runs -279.5 to 79.5 in 1 degree steps (longitudes below
     -180). gridlat_t runs -81.5 to 89.5 with steps from 1 degree down to
     1/3 degree near the equator. Units are "degree", with no
     standard_name or axis attributes.
  2. Those 1D axes are nominal. The 2D geolon_t/geolat_t equal them for
     rows below gridlat_t = 65.5. From that row north (rows 175-199) they
     differ by up to 24.3 degrees in latitude and 67.6 in longitude, which
     fits a tripolar Arctic grid (CM2.1's ocean is MOM4). Any reader that uses the
     1D axes puts the Arctic in the wrong place.
  3. tmask/umask are region codes 0..10, not 0/1 masks.
  4. GDAL's classic view of the file shows only subdatasets (the 512 x 512
     placeholder).

  test_3_.nc is CM2.1 control-run SST (2 time steps, cut with
  cdo -C seltimestep,1,2, per its history) on the same 360 x 200 T grid.
  Its missing-value mask agrees with tmask == 0 in 99.95% of cells. Its 1D
  xt/yt carry axis and standard_name attributes, but they are neither the
  nominal axes nor the true positions:
    - xt steps vary from 0.959 to 1.590 degrees and differ from gridlon_t by
      up to 1.84 degrees.
    - yt matches gridlat_t to 0.007 degrees south of 65.5N. North of that it
      flattens out, ending at 78.78 where the true geolat_t reaches 89.49.
  They are close to the row/column means of the 2D geolat_t/geolon_t
  (within 0.06 degrees lat and 0.40 degrees lon), but how they were made
  is not recorded. GDAL treats xt/yt as 1D geolocation arrays, so a
  default GDAL read of this file puts the SST in the wrong place north of
  65N. For example, cell (row 190, col 100) is at true -174.25E, 80.23N,
  but xt/yt say -178.04E, 74.96N.
how_to_read: |
  Verified with GDAL 3.14.0dev on 2026-11-07. Give the SST the 2D T-grid
  positions from the mask file as geolocation arrays, then warp:

    gdal_translate -of VRT NETCDF:test_3_.nc:SST sst.vrt
    # in sst.vrt, in <Metadata domain="GEOLOCATION">, change
    #   X_DATASET to NETCDF:"CM2.1_regionmask.nc":geolon_t
    #   Y_DATASET to NETCDF:"CM2.1_regionmask.nc":geolat_t
    gdalwarp -geoloc -t_srs EPSG:4326 -te -280 -90 80 90 -tr 0.25 0.25 \
      -r near sst.vrt sst_ll.tif

  This works because GDAL's classic view flips the rows of both files the
  same way (latitude ascends in both). Check: for every 3rd column of
  every row, the SST value at the cell's true (geolon_t, geolat_t) was
  looked up in sst_ll.tif. All 14574 ocean cells south of 65N matched
  exactly, and 1371 of 1462 (94%) in the tripolar region, where cells are
  small and some are overwritten in a 0.25 degree nearest-neighbour
  output. Output longitudes follow geolon_t (-280..80); shift by 360 to
  wrap. For the mask file itself, use geolon_t/geolat_t (or the _c pair
  for umask) in the same way. Do not use gridlon_t/gridlat_t as positions
  north of 65N.
