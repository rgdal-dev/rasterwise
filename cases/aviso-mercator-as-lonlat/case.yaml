id: aviso-mercator-as-lonlat
title: "Old AVISO geostrophic velocity grid: Mercator rows labelled as latitude, stored lon-major"
status: understood
summary: "A 2006 SSALTO/DUACS file whose 1D latitude axis is Mercator-spaced (1/3 degree in Mercator y), with data stored (lon, lat); read it as regular lon/lat and features land up to 19.5 degrees of latitude away."
files:
  - d7dcc72ce30b707c02c69c32a77bcbde638bb06ea9cbc530fcc68501e6481414  # extdata/dt_ref_global_merged_madt_uv_19921014_19921014_20060315.nc
  - febe778e5550aca5ec14493847ecd34a67fcf72d0ad23761cfb9c3d00ff97322  # extdata/rectlinear/readme_rectlinear.txt~febe778e
whats_wrong: |
  The file (global attribute FileType = "GRID_DOTS_MERCATOR", CreatedBy
  SSALTO/DUACS, 2006) holds U and V geostrophic velocity (Grid_0001,
  Grid_0002, cm/s) for 1992-10-14 on 1080 longitudes x 915 latitudes.

  1. The latitude axis is Mercator-spaced, not regular. NbLatitudes runs
     from -82.0 to 81.9746; the step is 0.0465 degrees near the poles and
     0.333 near the equator. Converted to spherical Mercator y
     (ln(tan(pi/4 + lat/2)), in degrees), the step is a constant 1/3 degree
     (relative spread 2e-12), equal to the longitude step. So this is a
     regular grid in spherical Mercator, not in lon/lat. The only grid
     metadata is LatLonMin = (-82, 0) and LatLonStep = (1/3, 1/3), which
     looks like a regular lon/lat grid. A reader that builds a regular
     lat axis from the end points (-82 to 81.97 in 915 rows) misplaces
     rows by up to 19.5 degrees of latitude: the true -59.98 row lands at
     -40.56 and the true 60.06 row at 40.71. (Checked by computing it.)
  2. The data arrays are declared (NbLongitudes, NbLatitudes), so the
     fastest-varying dimension is latitude. GDAL's classic raster view of
     NETCDF:...:Grid_0001 is 915 columns x 1080 rows (latitude across,
     longitude down), with no geotransform and no CRS.
  3. Latitude ascends (south first) and longitude runs 0 to 359.67.
  4. Fill value 1.844674e+19 (2^64), recognised by GDAL as nodata.

  Mercator on a sphere, not on an ellipsoid. With EPSG:3395 (ellipsoidal
  Mercator) the row spacing varies from 36858 to 37102 m, so that is not
  the grid. The sphere radius does not matter as long as the same sphere
  is used both ways. Not settled: whether the coordinate values are cell
  centres or cell edges. The recipe below assumes centres, the netCDF
  convention.
how_to_read: |
  Verified with GDAL 3.14.0dev on 2026-11-07. Transpose and flip to
  north-up, then assign spherical Mercator and the extent. px = R * radians(1/3) with
  R = 6378137 (37106.4969 m). The edges are half a cell beyond the first
  and last coordinate values (0 and 359.667 for lon; for lat, the Mercator
  y of -82 and 81.9746):

    gdalmdimtranslate dt_ref_global_merged_madt_uv_19921014_19921014_20060315.nc u.tif \
      -array "name=Grid_0001,transpose=[1,0],view=[::-1,:]"
    gdal_translate u.tif u_merc.tif -a_srs "+proj=merc +R=6378137 +units=m +no_defs" \
      -a_ullr -18553.2485 16966094.5000 40056463.4371 -16986350.1920

  (Use name=Grid_0002 for V.) gdalmdimtranslate applies transpose before
  view; the result was checked to equal the stored array transposed with
  the latitude order reversed. Check: 2000 random (NbLongitudes,
  NbLatitudes) pairs were projected to this Mercator (lon >= 180 shifted by
  one world width), and every one fell in a cell holding the matching
  stored value. To get lon/lat:
  gdalwarp -t_srs "+proj=longlat +R=6378137" -r near u_merc.tif u_ll.tif
  (the output spans -180..180; 1026 sampled points in that range all
  matched the stored values).
