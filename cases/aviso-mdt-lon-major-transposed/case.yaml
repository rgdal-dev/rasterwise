id: aviso-mdt-lon-major-transposed
title: "AVISO mean dynamic topography (CNES-CLS09, RIO07 Mediterranean): lon-major grids that GDAL georeferences with latitude as x"
status: understood
costume:
  - C
summary: "Regular 1/4 and 1/8 degree MDT grids stored (lon, lat); GDAL's classic view gives them a plausible geotransform with latitude across and longitude down, so the map is transposed without any error. RIO07 longitudes run past 360, CLS09's height holds two undocumented 9999 cells, and the CNES-CLS13 successor is CF (lat, lon) and reads correctly."
